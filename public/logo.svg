<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="embSilver" x1="15%" y1="30%" x2="85%" y2="70%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="15%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="embCyan" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00c8e0" />
    </linearGradient>

    <filter id="embGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan kinetic trajectory -->
  <line x1="52.5" y1="7" x2="36.5" y2="47.5" 
        stroke="url(#embCyan)" stroke-width="5.5" stroke-linecap="round" filter="url(#embGlow)" />
  <line x1="36.5" y1="47.5" x2="59.5" y2="62.5" 
        stroke="url(#embCyan)" stroke-width="4.8" filter="url(#embGlow)" />
  <line x1="59.5" y1="62.5" x2="47.5" y2="93" 
        stroke="url(#embCyan)" stroke-width="5.5" stroke-linecap="round" filter="url(#embGlow)" />

  <!-- Aerodynamic hourglass ribbon -->
  <polygon points="18,38 82,32 21,68 79,62" 
           stroke="url(#embSilver)" 
           stroke-width="5.0" 
           stroke-linecap="round" 
           stroke-linejoin="round" />

  <!-- Left vertex cyan accent flare -->
  <circle cx="18" cy="38" r="3.6" fill="#00f5ff" filter="url(#embGlow)" />
  <circle cx="18" cy="38" r="1.8" fill="#ffffff" />
</svg>